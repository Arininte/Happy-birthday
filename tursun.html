<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бидний Дурсамжууд 📸</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Гарчиг -->
        <div class="header">
            <h1>Зураг түүх өгүүлнэ 💖</h1>
            <p class="subtitle">Хамтдаа өнгөрүүлсэн сайхан мөчүүд</p>
        </div>

        <!-- Зургуудын цомог (Зураг оруулах хэсэг) -->
        <div class="gallery-grid">
            
            <!-- 1 ДҮГЭЭР ЗУРАГ -->
            <div class="photo-card">
                <!-- Заавар: "src/zurag1.jpg" гэдгийг өөрийн зургийн файлын нэрээр солино -->
                <img src="paper_ring.jpg" alt="Дурсамж 1">
                <p class="photo-caption">3 sariin 28❤️ </p>
            </div>

            <!-- 2 ДУГААР ЗУРАГ -->
            <div class="photo-card">
                <img src="galt_tereg.jpg" alt="Дурсамж 2">
                <p class="photo-caption">Хамтдаа  зугаалсандаа бэби❤️ </p>
            </div>

            <!-- 3 ДУГААР ЗУРАГ -->
            <div class="photo-card">
                <img src="alsanda.jpg" alt="Дурсамж 3">
                <p class="photo-caption">Хүүхэд алаад хаяцан байншдээ ✨</p>
            </div>

            <!-- 4 ДҮГЭЭР ЗУРАГ -->
            <div class="photo-card">
                <img src="deerlehdeg.jpg" alt="Дурсамж 4">
                <p class="photo-caption">Үргэлж хажууд минь байдагт баярлалаа ❤️</p>
            </div>


            <div class="photo-card">
                <img src="bultsen.jpg" alt="Дурсамж 5">
                <p class="photo-caption">Хамгийн хөөрхөн охиндооо ❤️ </p>
            </div>

            <!-- 6 ДУГААР ЗУРАГ (Шинээр нэмсэн) -->
            <div class="photo-card">
                <img src="erhun.jpg" alt="Дурсамж 6">
                <p class="photo-caption">Эр хүндээ миний хайр нь ❤️ </p>
            </div>
        </div>

        <!-- Буцах товчлуур -->
        <div class="center-content margin-top">
            <a href="hair.html" class="btn btn-secondary">
                ⬅️ Нүүр хуудас руу буцах
            </a>
        </div>
    </div>

</body>
</html>
